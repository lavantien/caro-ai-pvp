[default.extend-words]
thr = "thr"
# The icon format's plural reads as "PN" to the checker.
PNGs = "PNGs"

[files]
extend-exclude = [
    "ref/**",
    # Vendored exact-release minified artifacts: their identifiers are not prose.
    "internal/server/web/static/**",
    # Fuzz corpus seeds: hex-hash filenames, machine artifacts.
    "**/testdata/fuzz/**",
]
