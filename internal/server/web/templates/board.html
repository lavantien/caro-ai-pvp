{{define "board-css"}}
<style>
.board { display: grid; width: min(100%, 44rem); aspect-ratio: 1; margin: 0 auto;
	touch-action: manipulation; user-select: none; border: 2px solid var(--border);
	border-radius: var(--radius-m); background: var(--surface) }
.cell { position: relative; border: 1px solid var(--border) }
.stone { position: absolute; inset: 8%; border-radius: 50%; display: flex;
	align-items: center; justify-content: center; font-size: var(--text-l);
	font-weight: 700 }
.stone.red { background: var(--red); color: var(--background) }
.stone.blue { background: var(--blue); color: var(--background) }
.stone.latest { box-shadow: 0 0 0 3px var(--mark) }
.stone.hidden { display: none }
.board.live[data-my-color="red"] { --ghost: color-mix(in srgb, var(--red) 45%, transparent) }
.board.live[data-my-color="blue"] { --ghost: color-mix(in srgb, var(--blue) 45%, transparent) }
.board.live .cell:not(.occ):not(.off) { cursor: pointer }
.board.live .cell.ghost::after { content: ""; position: absolute; inset: 8%;
	border-radius: 50%; background: var(--ghost) }
@media (pointer: fine) {
	.board.live .cell:not(.occ):not(.off):hover::after { content: ""; position: absolute; inset: 8%;
		border-radius: 50%; background: var(--ghost) }
}
.board.live .cell.off { cursor: default; opacity: .22 }
.board.mini { width: min(100%, 22rem); margin: var(--space-1) auto 0 }
.board.mini .stone { font-size: var(--text-m) }
.board.hex { display: block; position: relative; background: var(--background) }
.board.hex > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
.board.hex .cell polygon { fill: var(--surface); stroke: var(--border); stroke-width: .22 }
.board.hex .cell circle.stone.red { fill: var(--red) }
.board.hex .cell circle.stone.blue { fill: var(--blue) }
.board.hex .cell circle.stone.latest { stroke: var(--mark); stroke-width: .55 }
.board.hex .cell:has(span.stone.red) polygon { fill: var(--red); stroke: none }
.board.hex .cell:has(span.stone.blue) polygon { fill: var(--blue); stroke: none }
.board.hex .cell:has(span.stone.latest) polygon { stroke: var(--mark); stroke-width: .55 }
.board.hex .cell.ghost polygon { fill: var(--ghost) }
@media (pointer: fine) {
	.board.hex.live .cell:not(.occ):not(.off):hover polygon { fill: var(--ghost) }
}
</style>
{{end}}

{{define "board-grid"}}
{{if .Hex}}
<div class="board hex{{if .Live}} live{{end}}{{if .Mini}} mini{{end}}"{{if not .Mini}} id="board"{{end}}{{if .MyColor}} data-my-color="{{.MyColor}}"{{end}}{{if .Mini}} aria-hidden="true"{{end}} style="aspect-ratio:{{.HexBoard.Aspect}}">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="{{.HexBoard.ViewBox}}" role="img" aria-label="hex board">
{{- range .HexBoard.Cells}}
<g class="cell{{if .Stone}} occ{{end}}{{if .Off}} off{{end}}"{{if not $.Mini}} id="c-{{.Name}}" data-cell="{{.Name}}"{{end}} transform="{{.Transform}}"><polygon points="{{$.HexBoard.Points}}"/>{{if .Stone}}<circle class="stone {{.Stone}}{{if .Latest}} latest{{end}}" data-i="{{.Idx}}" r="{{$.HexBoard.StoneR}}"/>{{end}}</g>
{{- end}}
</svg>
</div>
{{else}}
<div class="board{{if .Live}} live{{end}}{{if .Mini}} mini{{end}}"{{if not .Mini}} id="board"{{end}}{{if .MyColor}} data-my-color="{{.MyColor}}"{{end}}{{if .Mini}} aria-hidden="true"{{end}} style="grid-template-columns:repeat({{.BoardSize}},1fr)">
{{- range .Cells}}
<div class="cell{{if .Stone}} occ{{end}}{{if .Off}} off{{end}}"{{if not $.Mini}} id="c-{{.Name}}" data-cell="{{.Name}}"{{end}}>{{if .Stone}}<span class="stone {{.Stone}}{{if .Latest}} latest{{end}}" data-i="{{.Idx}}">{{.Glyph}}</span>{{end}}</div>
{{- end}}
</div>
{{end}}
{{end}}
