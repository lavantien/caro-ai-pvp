name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      global: ${{ steps.total.outputs.global }}
      core: ${{ steps.total.outputs.core }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: toolchain check
        run: go run ./cmd/run doctor
      - name: run ci
        run: go run ./cmd/run ci
      - id: total
        name: coverage percentages
        run: |
          for kv in $(go run ./cmd/run cover-pcts); do echo "$kv" >> "$GITHUB_OUTPUT"; done
      - name: upload coverage profile
        uses: actions/upload-artifact@v6
        with:
          name: coverage-profile
          path: coverage.out

  mutate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: rules-core mutation smoke gate
        run: go run ./cmd/run mutate-smoke

  badge:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v6
        with:
          name: coverage-profile
      - name: generate coverage badges
        run: go run ./cmd/run cover-badges SHA=${{ github.sha }} RUN_ID=${{ github.run_id }}
      - name: publish coverage badges
        run: |
          set -e
          git checkout -q --orphan coverage
          git rm -rqf .
          git add coverage-global.svg coverage-global.json coverage-core.svg coverage-core.json source.json
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "coverage: global ${{ needs.ci.outputs.global }}% core ${{ needs.ci.outputs.core }}% sha ${{ github.sha }} run ${{ github.run_id }}"
          git push -qf origin coverage
