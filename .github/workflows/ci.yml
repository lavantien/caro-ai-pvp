name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      global: ${{ steps.total.outputs.global }}
      core: ${{ steps.total.outputs.core }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: toolchain check
        run: go run ./cmd/run doctor
      - name: run ci
        run: go run ./cmd/run ci
      - id: total
        name: coverage percentages
        run: |
          for kv in $(go run ./cmd/run cover-pcts); do echo "$kv" >> "$GITHUB_OUTPUT"; done
      - name: upload coverage profile
        uses: actions/upload-artifact@v6
        with:
          name: coverage-profile
          path: coverage.out

  mutate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: rules-core mutation smoke gate
        run: go run ./cmd/run mutate-smoke

  publish:
    needs: [ci, mutate-smoke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERDICT: ${{ (needs.ci.result == 'success' && needs.mutate-smoke.result == 'success') && 'passed' || 'failed' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: download coverage profile
        if: needs.ci.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: coverage-profile
      - name: generate coverage badges
        if: needs.ci.result == 'success'
        run: go run ./cmd/run cover-badges SHA=${{ github.sha }} RUN_ID=${{ github.run_id }} VERDICT=${{ env.VERDICT }}
      - name: generate verdict badge
        if: needs.ci.result != 'success'
        run: go run ./cmd/run cover-verdict SHA=${{ github.sha }} RUN_ID=${{ github.run_id }} VERDICT=${{ env.VERDICT }}
      - name: publish badges
        run: |
          set -e
          files="ci.svg source.json"
          msg="badges: ci $VERDICT sha ${{ github.sha }} run ${{ github.run_id }}"
          if [ "${{ needs.ci.result }}" = "success" ]; then
            files="coverage-global.svg coverage-global.json coverage-core.svg coverage-core.json $files"
            msg="$msg global ${{ needs.ci.outputs.global }}% core ${{ needs.ci.outputs.core }}%"
          fi
          git checkout -q --orphan coverage
          git rm -rqf .
          git add $files
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "$msg"
          git push -qf origin coverage
