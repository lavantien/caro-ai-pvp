name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      global: ${{ steps.total.outputs.global }}
      core: ${{ steps.total.outputs.core }}
      global-good: ${{ steps.total.outputs.global-good }}
      global-warn: ${{ steps.total.outputs.global-warn }}
      core-good: ${{ steps.total.outputs.core-good }}
      core-warn: ${{ steps.total.outputs.core-warn }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: toolchain check
        run: go run ./cmd/run doctor
      - name: run ci
        run: go run ./cmd/run ci
      - id: total
        name: coverage percentages
        run: |
          for kv in $(go run ./cmd/run cover-pcts); do echo "$kv" >> "$GITHUB_OUTPUT"; done
      - name: upload coverage profile
        uses: actions/upload-artifact@v6
        with:
          name: coverage-profile
          path: coverage.out

  mutate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: rules-core mutation smoke gate
        run: go run ./cmd/run mutate-smoke

  badge:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: publish coverage badges
        env:
          GLOBAL: ${{ needs.ci.outputs.global }}
          CORE: ${{ needs.ci.outputs.core }}
          GLOBAL_GOOD: ${{ needs.ci.outputs.global-good }}
          GLOBAL_WARN: ${{ needs.ci.outputs.global-warn }}
          CORE_GOOD: ${{ needs.ci.outputs.core-good }}
          CORE_WARN: ${{ needs.ci.outputs.core-warn }}
        run: |
          set -e
          badge() {
            label=$1 value=$2 good=$3 warn=$4 base=$5
            case 1 in
              "$(awk -v p="$value" -v m="$good" 'BEGIN {print (p >= m) ? 1 : 0}')") fill=#4c1 color=brightgreen ;;
              "$(awk -v p="$value" -v m="$warn" 'BEGIN {print (p >= m) ? 1 : 0}')") fill=#dfb317 color=yellow ;;
              *) fill=#e05d44 color=red ;;
            esac
            pctvalue="${value}%"
            lw=$(( ${#label} * 7 + 12 ))
            vw=$(( ${#pctvalue} * 7 + 12 ))
            w=$(( lw + vw ))
            mx1=$(( lw / 2 ))
            mx2=$(( lw + vw / 2 ))
            printf -v svg '<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="20" role="img" aria-label="%s: %s"><linearGradient id="g" x2="0" y2="100%%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="%d" height="20" rx="3"/></clipPath><g clip-path="url(#r)"><rect width="%d" height="20" fill="#555"/><rect x="%d" width="%d" height="20" fill="%s"/><rect width="%d" height="20" fill="url(#g)"/></g><g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle"><text x="%d" y="14">%s</text><text x="%d" y="14">%s</text></g></svg>' \
              "$w" "$label" "$pctvalue" "$w" "$w" "$lw" "$vw" "$fill" "$w" "$mx1" "$label" "$mx2" "$pctvalue"
            printf -v json '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}' "$label" "$pctvalue" "$color"
            printf '%s' "$svg" > "$base.svg"
            printf '%s' "$json" > "$base.json"
          }
          badge "global coverage" "$GLOBAL" "$GLOBAL_GOOD" "$GLOBAL_WARN" coverage-global
          badge "core coverage" "$CORE" "$CORE_GOOD" "$CORE_WARN" coverage-core
          git checkout -q --orphan coverage
          git rm -rqf .
          git add coverage-global.svg coverage-global.json coverage-core.svg coverage-core.json
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "coverage: global $GLOBAL% core $CORE%"
          git push -qf origin coverage
